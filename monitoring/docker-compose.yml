# One monitoring stack for the whole team on this GB10. ONE person starts it (see sessions/s12/task.md, part A);
# everybody else only logs in to Grafana. Never start a second copy from another folder.
# Prometheus reads the model's /metrics every 5 seconds; Grafana draws the charts.
# Both use the host network, so they reach the model on 127.0.0.1 like any program on this machine.
name: familyhub-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: familyhub-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.listen-address=127.0.0.1:9090     # only on this machine; participants use Grafana
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: familyhub-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: "3001"                 # 3000 is Open WebUI
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?create .env first, see sessions/s12/task.md step A4}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
