# What Prometheus reads, and how often.
global:
  scrape_interval: 5s        # read the numbers every 5 seconds
  evaluation_interval: 15s

scrape_configs:
  - job_name: model          # the language model the assistant uses (vLLM)
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8004"]     # the port of the model; change it if your model runs on another port
        labels:
          service: family-hub
